    <meta name="description" content="Modern minimal travel planning app for managing trips and day-wise itineraries, backed by Supabase PostgreSQL and MCP." />
    <meta property="og:title" content="TripCanvas — Travel & Itinerary Planner" />
    <meta property="og:description" content="Modern minimal travel planning app for managing trips and day-wise itineraries, backed by Supabase PostgreSQL and MCP." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet" />
    <script>
      window.addEventListener(
        'error',
        function (event) {
          var isExtension =
            typeof event.filename === 'string' &&
            (event.filename.indexOf('chrome-extension://') === 0 ||
              event.filename.indexOf('moz-extension://') === 0);
          var isEthereumCollision =
            typeof event.message === 'string' &&
            event.message.indexOf('Cannot redefine property: ethereum') !== -1;
          if (isExtension && isEthereumCollision) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        },
        true
      );
    </script>
  </head>
  <body class="bg-[#F7F8F6] text-zinc-900 antialiased selection:bg-emerald-100 selection:text-emerald-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
